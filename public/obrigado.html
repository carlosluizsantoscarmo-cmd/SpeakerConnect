<head>

<title>Pedido recebido | SpeakerConnect</title>
<meta name="description" content="Conheça a história, a missão, a visão e os valores do SpeakerConnect, a plataforma capixaba que conecta empresas a palestrantes.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1A4B">

<body>
<header id="top"></header>
<main class="about">
<section class="ab-hero"><div class="wrap">
  <p class="ab-eb">Recebido</p>
  <h1 id="ob-t">Obrigado! <span>Já estamos cuidando do seu pedido.</span></h1>
  <p class="ab-lead" id="ob-p">Nossa equipe vai responder em até 1 dia útil com sugestões de palestrantes para o seu evento. Enviamos uma confirmação para o seu e-mail.</p>
  <div class="ab-btns" style="justify-content:flex-start;margin-top:26px"><a class="btn spot" href="/#palestrantes">Ver os palestrantes</a><a class="btn ghost" href="/campanhas">Calendário de campanhas</a></div>
</div></section>
</main>
<footer id="bottom"></footer>
<script src="/config.js"></script>
<script src="/site.js"></script>
<script>
if (new URLSearchParams(location.search).get("tipo") === "entidade") {
  document.getElementById("ob-t").innerHTML = 'Obrigado! <span>Vamos conversar sobre a parceria.</span>';
  document.getElementById("ob-p").textContent = "Recebemos o contato da sua entidade e vamos falar com você em até 1 dia útil. Enviamos uma confirmação para o seu e-mail.";
}
</script>
